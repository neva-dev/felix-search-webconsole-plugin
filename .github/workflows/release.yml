name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  check:
    name: Check
    uses: ./.github/workflows/check.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: write
      packages: write
    steps:
      - name: Extract Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Deploy to GitHub Packages
        run: mvn -B deploy -Drevision=${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with Assets
        run: >
          gh release create ${{ env.VERSION }}
          --title "${{ env.VERSION }}"
          --draft=false
          --prerelease=false
          --generate-notes
          target/search-webconsole-plugin-${{ env.VERSION }}.jar
          target/search-webconsole-plugin-${{ env.VERSION }}-sources.jar
          target/search-webconsole-plugin-${{ env.VERSION }}-javadoc.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
